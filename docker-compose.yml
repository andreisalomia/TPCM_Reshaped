include:
  - monitoring/docker-compose.yml

networks:
  tpcm-network:
    driver: bridge

volumes:
  oracle-data:

services:
  oracle:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: oracle-tpcm
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
      - ORACLE_CHARACTERSET=${ORACLE_CHARACTERSET}
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - tpcm-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/${ORACLE_PWD}@//localhost:1521/FREEPDB1 | grep -q '1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093,PLAINTEXT://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
    networks:
      - tpcm-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  tpcm-scheduler:
    build:
      context: ./tpcm-scheduler
      dockerfile: Dockerfile
    container_name: tpcm-scheduler
    ports:
      - "7000:7000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./tpcm-scheduler/logs:/app/logs
      - ./tpcm-scheduler/src/main/resources/application.properties:/app/config/application.properties
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - tpcm-network
    restart: on-failure:5

  tpcm-spring:
    build:
      context: ./tpcm_spring
      dockerfile: Dockerfile
    container_name: tpcm_spring
    # healthcheck:
    #   test: ["CMD-SHELL", "busybox wget -q -O - http://localhost:8080/actuator/health || exit 1"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 60
    #   start_period: 10s
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./tpcm_spring/logs:/app/logs
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tpcm-network
    restart: on-failure:5

  tpcm-clients:
    build:
      context: ./tpcm_clients
      dockerfile: Dockerfile
    container_name: tpcm-clients
    # healthcheck:
    #   test: ["CMD-SHELL", "busybox wget -q -O - http://localhost:8081/actuator/health || exit 1"]
    #   interval: 5s
    #   timeout: 3s
    #   retries: 60
    #   start_period: 10s
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./tpcm_clients/logs:/app/logs
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tpcm-network
    restart: on-failure:5

  kafka-consumer:
    build:
      context: ./KafkaConsumerTPCM
      dockerfile: Dockerfile
    container_name: kafka-consumer
    ports:
      - "6999:6999"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./KafkaConsumerTPCM/logs:/app/logs
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tpcm-spring:
        condition: service_started
      tpcm-clients:
        condition: service_started
    networks:
      - tpcm-network
    restart: on-failure:5

  voice-simulator:
    build:
      context: ./TPCM_Voice_Simulator
      dockerfile: Dockerfile
    container_name: voice-simulator
    ports:
      - "4242:4242"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./TPCM_Voice_Simulator/logs:/app/logs
    depends_on:
      oracle:
        condition: service_healthy
      tpcm-spring:
        condition: service_started
    networks:
      - tpcm-network
    restart: on-failure:5

  tpcm-store:
    build:
      context: ./tpcm-store
      dockerfile: Dockerfile
    container_name: tpcm-store
    ports:
      - "3000:80"
    depends_on:
      tpcm-spring:
        condition: service_started
    networks:
      - tpcm-network
    restart: on-failure:5