networks:
  tpcm-network:
    driver: bridge

volumes:
  oracle-data:

services:
  oracle:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle-tpcm
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
    - ORACLE_PWD=matcha123
    - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - tpcm-network
  tpcm-scheduler:
    build:
      context: ./tpcm-scheduler
      dockerfile: Dockerfile
    container_name: tpcm-scheduler
    ports:
      - "7000:7000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./tpcm-scheduler/logs:/app/logs
    depends_on:
      - oracle
    networks:
      - tpcm-network
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092'
      KAFKA_LISTENERS: 'PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093,PLAINTEXT://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
    networks:
      - tpcm-network
  tpcm-spring:
    build:
      context: ./tpcm_spring
      dockerfile: Dockerfile
    container_name: tpcm_spring
    healthcheck:
      test: ["CMD-SHELL", "busybox wget -q -O - --header 'Authorization: Basic YWRtaW46YWRtaW4=' http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./tpcm_spring/logs:/app/logs
    depends_on:
      - oracle
      - kafka
    networks:
      - tpcm-network
    restart: unless-stopped

  kafka-consumer:
    build:
      context: ./KafkaConsumerTPCM
      dockerfile: Dockerfile
    container_name: kafka-consumer
    ports:
      - "6999:6999"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./KafkaConsumerTPCM/logs:/app/logs
    depends_on:
      oracle:
        condition: service_started
      kafka:
        condition: service_started
      tpcm-spring:
        condition: service_healthy
    networks:
      - tpcm-network
    restart: unless-stopped

  voice-simulator:
    build:
      context: ./TPCM_Voice_Simulator
      dockerfile: Dockerfile
    container_name: voice-simulator
    ports:
      - "4242:4242"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./TPCM_Voice_Simulator/logs:/app/logs
    depends_on:
      - oracle
      - tpcm-spring
    networks:
      - tpcm-network
    restart: unless-stopped
