spring.application.name=tpcm-kafka-consumer
spring.application.version=1.0
server.port=6999

app.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
app.datasource.username=tpcm_app
app.datasource.password=tpcm_pass
app.datasource.driver-class-name=oracle.jdbc.OracleDriver

clients.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
clients.datasource.username=tpcm_db
clients.datasource.password=tpcm_pass
clients.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=tpcm-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

logging.level.com.example.kafkaconsumer=INFO
logging.level.org.apache.kafka=WARN
spring.main.banner-mode=off

spring.session.store-type=none